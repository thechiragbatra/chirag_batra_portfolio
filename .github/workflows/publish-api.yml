# Builds the API image (linux/amd64) and publishes it to GitHub Container Registry, where
# Azure Container Apps pulls it from (deploy/azure/). Uses the workflow's own token: no
# registry passwords to manage, and ghcr.io is free for public images.
name: Publish API image

on:
  push:
    branches: ["main"]
    paths:
      - "agents/**"
      - "backend/**"
      - "frontend/src/data/**"
      - "frontend/public/models/**"
      - "deploy/docker/api.Dockerfile"
      - ".github/workflows/publish-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-api
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/deploysmith-api
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build
        run: |
          docker build -f deploy/docker/api.Dockerfile \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .
      - name: Push
        run: |
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
