# Runs the same checks as the README's "Checks" section on every push and pull request.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python and dependencies
        run: uv python install 3.12 && uv sync --frozen
      - name: Lint
        run: uvx ruff check . ../agents
      - name: Format
        run: uvx ruff format --check . ../agents
      - name: Tests
        # Offline: network and Docker tests are excluded by default (see pyproject.toml).
        run: uv run pytest -q

  frontend:
    name: Frontend (oxlint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Typecheck and build
        run: npm run build

  ml:
    name: Churn Lab training code (pytest, ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml/churn
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ml/churn/uv.lock
      - name: Install Python and dependencies
        run: uv python install 3.12 && uv sync --frozen
      - name: Lint
        run: uvx ruff check . && uvx ruff format --check .
      - name: Tests
        # Offline: the tests build their own small datasets.
        run: uv run pytest -q

  images:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deploy/docker/api.Dockerfile -t deploysmith-api .
      - name: Build web image
        run: docker build -f deploy/gcp/web.Dockerfile --build-arg VITE_API_URL=https://example.invalid -t deploysmith-web .
