[project]
name = "churn-lab"
version = "0.1.0"
description = "Trains the churn and uplift models behind the site's Churn Lab and exports them for the browser"
requires-python = ">=3.11"
dependencies = [
    "imbalanced-learn>=0.14",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "xgboost>=2.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
