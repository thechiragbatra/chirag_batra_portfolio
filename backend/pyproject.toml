[project]
name = "deploysmith-backend"
version = "0.1.0"
description = "DeploySmith OS backend: FastAPI + LangGraph orchestration of deployment agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.15",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: needs internet access (run with: pytest -m network)",
    "docker: needs a running Docker daemon (run with: pytest -m docker)",
]
addopts = "-m 'not network and not docker'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", ".."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
